:root{--bg:#14120f;--panel:#1d1a16;--panel2:#26221d;--line:#ffffff17;--txt:#f1ebe0;--mute:#9a9082;--acc:#e0a23b;--ok:#5fb08a;--bad:#e0694d}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:Inter,sans-serif;min-height:100vh}
.hidden{display:none!important}
.brand{display:flex;align-items:center;gap:11px}
h1,h2,h3{font-family:Fraunces,serif}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:'JetBrains Mono',monospace}
.inp{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 13px;outline:none}
.inp:focus{border-color:var(--acc)}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login form{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:34px}
.login h2{font-size:25px;margin:6px 0 4px}.login p{color:var(--mute);font-size:14px;margin-bottom:12px}
.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--acc);font-weight:600}
.lbl{display:block;font-size:12.5px;color:var(--mute);margin:14px 0 6px}
.pri{width:100%;margin-top:20px;background:var(--acc);color:#1a1408;border:0;border-radius:8px;padding:12px;font-weight:600;cursor:pointer}
.pri:disabled{opacity:.5}
.err{color:var(--bad);font-size:13px;margin-top:12px}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 32px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#14120fee;backdrop-filter:blur(8px);z-index:5}
.brand{font-family:Fraunces;font-weight:700;font-size:18px}.brand small{display:block;font-family:Inter;font-weight:400;font-size:11.5px;color:var(--mute)}
.hr{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--mute)}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:7px 13px;cursor:pointer;font-size:13px}.ghost:hover{border-color:var(--acc)}
main{max-width:1040px;margin:0 auto;padding:30px 24px 80px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.kpi span{font-size:12.5px;color:var(--mute)}.kpi b{display:block;font-size:30px;font-weight:500;margin-top:4px;font-family:'JetBrains Mono'}
.kpi.p b{color:var(--acc)}.kpi.a b{color:var(--ok)}.kpi.r b{color:var(--bad)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{background:none;border:0;padding:7px 14px;border-radius:7px;cursor:pointer;color:var(--mute);font-size:13.5px}
.tabs button.on{background:var(--panel2);color:var(--txt)}
.bar .inp{width:auto}.bar .grow{flex:1;min-width:180px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:14px}
.card.approved{border-left:3px solid var(--ok)}.card.rejected{border-left:3px solid var(--bad)}.card.pending{border-left:3px solid var(--acc)}
.ct{display:flex;justify-content:space-between;gap:12px}
.card h3{font-size:17px}.by{font-size:13px;color:var(--acc);font-weight:500}
.meta{font-size:12.5px;color:var(--mute);margin-top:3px}
.badge{font-size:12px;font-weight:600;padding:4px 11px;border-radius:99px;height:fit-content;white-space:nowrap}
.pending .badge{background:#e0a23b22;color:var(--acc)}.approved .badge{background:#5fb08a22;color:var(--ok)}.rejected .badge{background:#e0694d22;color:var(--bad)}
.body{margin:14px 0;line-height:1.7;font-size:14.5px;white-space:pre-wrap;color:#d9d1c3}
.op{font-size:13px;color:var(--mute);font-style:italic;margin-bottom:12px}
.rv{background:var(--panel2);border-radius:10px;padding:14px}
.rv textarea{min-height:64px;resize:vertical;margin-top:6px}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.acts button{border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;font-size:13.5px}
.b-ok{background:var(--ok);color:#0d1f17}.b-bad{background:var(--bad);color:#2a0d07}.b-n{background:transparent;border:1px solid var(--line)!important;color:var(--txt)}
.empty{text-align:center;color:var(--mute);padding:60px 0}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:11px 22px;border-radius:99px;font-size:14px;z-index:20}
@media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}header{padding:12px 16px}}
</style>
</head>
<body>
<div id="boot" style="padding:60px;text-align:center;color:#9a9082">Loading…</div>
<section id="login" class="login hidden"><form id="lf">
  <span class="lg big"></span><div class="eyebrow" style="margin-top:10px">REVIEW DESK</div><h2>Admin sign in</h2><p>Authorised administrators only.</p>
  <label class="lbl">Email</label><input class="inp" type="email" id="em" required>
  <label class="lbl">Password</label><input class="inp" type="password" id="pw" required>
  <div id="le" class="err hidden"></div><button class="pri" id="lb">Sign in</button><div style="text-align:center;margin-top:14px"><a id="fp" style="color:var(--acc);font-size:13px;cursor:pointer">Forgot / reset password</a></div>
</form></section>

<div id="app" class="hidden">
  <header>
    <div class="brand"><span class="lg"></span><div>Review Desk<small>Tri Nayon · Admin</small></div></div>
    <div class="hr"><span id="me"></span><button class="ghost" id="clean" title="Deletes legacy entries that have no review status">Clear legacy data</button><button class="ghost" id="out">Sign out</button></div>
  </header>
  <main>
    <div class="tabs" id="top" style="margin-bottom:22px;width:fit-content"><button class="on" data-v="rev">Reviews</button><button data-v="tasks">Assign tasks</button></div>
    <div id="v-rev">
    <div class="kpis">
      <div class="kpi p"><span>Awaiting review</span><b id="k-p">0</b></div>
      <div class="kpi a"><span>Approved</span><b id="k-a">0</b></div>
      <div class="kpi r"><span>Changes requested</span><b id="k-r">0</b></div>
      <div class="kpi"><span>Approved hours</span><b id="k-h">0</b></div>
    </div>
    <div class="bar">
      <div class="tabs" id="tabs"><button data-t="pending" class="on">Pending</button><button data-t="approved">Approved</button><button data-t="rejected">Changes</button><button data-t="all">All</button></div>
      <select class="inp" id="sf"><option value="">All staff</option></select>
      <input class="inp grow" id="q" placeholder="Search subject, staff or details…">
    </div>
    <div id="list"></div>
    </div>
    <div id="v-tasks" class="hidden">
      <div class="card"><h3>Assign a task</h3>
        <label class="lbl">Task title</label><input class="inp" id="t-title" placeholder="e.g. Video editing">
        <label class="lbl">Details (optional)</label><textarea class="inp" id="t-det" style="min-height:64px;resize:vertical"></textarea>
        <div class="bar" style="margin:14px 0 0"><select class="inp" id="t-to"><option value="all">Everyone</option></select><input class="inp" type="date" id="t-due" title="Deadline (optional)"><button class="pri" id="t-add" style="width:auto;margin:0;padding:10px 22px">Assign task</button></div>
      </div>
      <div id="tlist"></div>
    </div>
  </main>
</div>
<div id="toast" class="hidden"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{initializeAuth,indexedDBLocalPersistence,browserLocalPersistence,browserSessionPersistence,onAuthStateChanged,signInWithEmailAndPassword,sendPasswordResetEmail,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,addDoc,onSnapshot,getDocs,doc,getDoc,updateDoc,deleteDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyA4OA9xJQd8xLLXDIdI5XckjsER8aRx9Do",authDomain:"daily-8b061.firebaseapp.com",projectId:"daily-8b061",storageBucket:"daily-8b061.firebasestorage.app",messagingSenderId:"151004750186",appId:"1:151004750186:web:5045d01ac5352c6b4f8513"});
const auth=initializeAuth(app,{persistence:[indexedDBLocalPersistence,browserLocalPersistence,browserSessionPersistence]}),db=getFirestore(app),$=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast=m=>{const t=$("toast");t.textContent=m;t.classList.remove("hidden");setTimeout(()=>t.classList.add("hidden"),3000)};
const L={pending:"Pending",approved:"Approved",rejected:"Changes requested"};
// Put your admin email(s) here in lowercase — must match the emails in firestore.rules
const ADMIN_EMAILS=["antorsikder12@gmail.com"];
const ERR={"auth/invalid-credential":"Wrong email or password, or this account doesn't exist in Firebase Authentication.","auth/wrong-password":"Wrong password.","auth/user-not-found":"No account with this email.","auth/too-many-requests":"Too many attempts. Wait a few minutes or reset your password.","auth/invalid-email":"Invalid email address."};
let all=[],legacy=[],users={},tab="pending",unsub=null,tasks=[];

$("lf").onsubmit=async e=>{e.preventDefault();$("le").classList.add("hidden");$("lb").disabled=true;
  try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value)}
  catch(x){$("le").textContent=(ERR[x.code]||"Sign-in failed")+" ["+x.code+"]";$("le").classList.remove("hidden")}
  $("lb").disabled=false};
$("fp").onclick=async()=>{const em=$("em").value.trim();if(!em){$("le").textContent="Enter your email above first, then click reset.";$("le").classList.remove("hidden");return}
  try{await sendPasswordResetEmail(auth,em);$("le").style.color="var(--ok)";$("le").textContent="Password reset email sent to "+em+".";}catch(x){$("le").style.color="";$("le").textContent="Could not send reset email ["+x.code+"]"}
  $("le").classList.remove("hidden")};
$("out").onclick=()=>signOut(auth);

const mins=x=>Math.round((+x.hours||0)*60+(+x.minutes||0)),fmtM=m=>Math.floor(m/60)+"h "+m%60+"m";
let unsubs=[];
document.querySelectorAll("#top button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#top button").forEach(x=>x.classList.toggle("on",x===b));$("v-rev").classList.toggle("hidden",b.dataset.v!=="rev");$("v-tasks").classList.toggle("hidden",b.dataset.v!=="tasks")});

onAuthStateChanged(auth,async u=>{unsubs.forEach(f=>f());unsubs=[];
  if(!u){$("boot").classList.add("hidden");$("app").classList.add("hidden");$("login").classList.remove("hidden");return}
  let d={},read=false;
  for(let i=0;i<3&&!read;i++){try{const s=await getDoc(doc(db,"users",u.uid));d=s.exists()?s.data():{};read=true}catch{await new Promise(r=>setTimeout(r,700))}}
  const ok=d.role==="admin"||ADMIN_EMAILS.includes((u.email||"").toLowerCase());
  $("boot").classList.add("hidden");
  if(!ok){const em=u.email;
    if(read){await signOut(auth);$("le").textContent=em+" signed in, but has no admin access. Set role to \"admin\" on users/"+u.uid+" in Firestore, or add the email to ADMIN_EMAILS."}
    else $("le").textContent="Could not verify admin access (network?). You are still signed in — refresh to retry.";
    $("le").style.color="";$("le").classList.remove("hidden");$("app").classList.add("hidden");$("login").classList.remove("hidden");return}
  $("me").textContent=d.name||u.email;$("login").classList.add("hidden");$("app").classList.remove("hidden");
  $("sf").innerHTML='<option value="">All staff</option>';$("t-to").innerHTML='<option value="all">Everyone</option>';
  try{const us=await getDocs(collection(db,"users"));us.forEach(x=>{users[x.id]=x.data();if(x.data().role!=="admin"){const o=`<option value="${x.id}">${esc(x.data().name||x.data().email)}</option>`;$("sf").insertAdjacentHTML("beforeend",o);$("t-to").insertAdjacentHTML("beforeend",o)}})}catch{}
  unsubs.push(onSnapshot(collection(db,"entries"),s=>{
    const r=s.docs.map(x=>({id:x.id,...x.data()}));
    legacy=r.filter(x=>!x.approval);
    all=r.filter(x=>x.approval).sort((a,b)=>(b.createdAt?.toMillis?.()||Date.now())-(a.createdAt?.toMillis?.()||Date.now()));
    $("clean").classList.toggle("hidden",!legacy.length);$("clean").textContent=`Clear legacy data (${legacy.length})`;
    render();renderTasks()},()=>toast("Could not load entries — check Firestore rules")));
  unsubs.push(onSnapshot(collection(db,"tasks"),s=>{tasks=s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>(b.createdAt?.toMillis?.()||Date.now())-(a.createdAt?.toMillis?.()||Date.now()));renderTasks()},()=>toast("Could not load tasks — check Firestore rules")))});

function renderTasks(){
  $("tlist").innerHTML=tasks.length?tasks.map(t=>{
    const es=all.filter(e=>e.taskId===t.id),done=new Set(es.filter(e=>e.completed===true&&e.approval!=="rejected").map(e=>e.uid)),tm=es.reduce((s,e)=>s+mins(e),0);
    const who=t.assignedTo==="all"?"Everyone":(users[t.assignedTo]?.name||t.assignedName||"Staff"),closed=t.status==="closed";
    const st=closed?"Closed":t.assignedTo==="all"?done.size+" completed":done.size?"Completed":es.length?"In progress":"Not started";
    return `<article class="card ${closed?"":"pending"}" data-id="${t.id}"><div class="ct"><div><div class="by">${esc(who)}</div><h3>${esc(t.title)}</h3><div class="meta">${t.deadline?"Due "+esc(t.deadline)+" · ":""}${es.length} submission(s) · ${fmtM(tm)} logged</div></div><span class="badge" style="background:#ffffff14;color:var(--txt)">${st}</span></div>${t.details?`<div class="body">${esc(t.details)}</div>`:""}<div class="acts"><button class="b-n" data-ta="${closed?"open":"closed"}">${closed?"Reopen":"Close task"}</button><button class="b-bad" data-ta="del">Delete</button></div></article>`}).join(""):`<div class="empty">No tasks assigned yet.</div>`}
$("t-add").onclick=async()=>{const title=$("t-title").value.trim();if(!title){toast("Enter a task title");return}
  const to=$("t-to").value;
  try{await addDoc(collection(db,"tasks"),{title,details:$("t-det").value.trim(),assignedTo:to,assignedName:to==="all"?"Everyone":(users[to]?.name||users[to]?.email||""),deadline:$("t-due").value||null,status:"open",createdAt:serverTimestamp(),createdBy:auth.currentUser.uid});
    ["t-title","t-det","t-due"].forEach(i=>$(i).value="");toast("Task assigned")}catch{toast("Could not assign — check Firestore rules")}};
$("tlist").onclick=async e=>{const b=e.target.closest("[data-ta]");if(!b)return;const id=b.closest(".card").dataset.id;
  try{if(b.dataset.ta==="del"){if(!confirm("Delete this task?"))return;await deleteDoc(doc(db,"tasks",id))}else await updateDoc(doc(db,"tasks",id),{status:b.dataset.ta});toast("Saved")}catch{toast("Action failed — check Firestore rules")}};

$("clean").onclick=async()=>{
  if(!legacy.length||!confirm(`${legacy.length} legacy entries will be permanently deleted. Continue?`))return;
  let n=0;for(const x of legacy){try{await deleteDoc(doc(db,"entries",x.id));n++}catch{}}
  toast(n+" legacy entries deleted")};

document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));render()});
$("sf").onchange=render;$("q").oninput=render;

function render(){
  const c=k=>all.filter(x=>x.approval===k).length;
  $("k-p").textContent=c("pending");$("k-a").textContent=c("approved");$("k-r").textContent=c("rejected");
  $("k-h").textContent=fmtM(all.filter(x=>x.approval==="approved").reduce((s,x)=>s+mins(x),0));
  const q=$("q").value.toLowerCase().trim(),sf=$("sf").value;
  const rows=all.filter(x=>(tab==="all"||x.approval===tab)&&(!sf||x.uid===sf)&&(!q||(x.subject+" "+x.workHistory+" "+x.name).toLowerCase().includes(q)));
  $("list").innerHTML=rows.length?rows.map(x=>`<article class="card ${x.approval}" data-id="${x.id}">
    <div class="ct"><div><div class="by">${esc(x.name||users[x.uid]?.name||"Staff")}</div><h3>${esc(x.subject)}</h3>
    <div class="meta">${esc(x.startDate)} · ⏱ ${fmtM(mins(x))} · ${x.completed===true?"✅ Completed":x.completed===false?"⏳ Not completed":esc(x.progress)}</div></div><span class="badge">${L[x.approval]}</span></div>
    ${x.workHistory?`<div class="body">${esc(x.workHistory)}</div>`:""}${x.opinion?`<div class="op">“${esc(x.opinion)}”</div>`:""}
    <div class="rv"><label class="lbl" style="margin:0">Review note (visible to the staff member)</label>
    <textarea class="inp" placeholder="Write your review…">${esc(x.review)}</textarea>
    <div class="acts"><button class="b-ok" data-a="approved">Approve</button><button class="b-bad" data-a="rejected">Request changes</button><button class="b-n" data-a="${x.approval}">Save note only</button></div></div></article>`).join(""):`<div class="empty">Nothing here yet.</div>`}

$("list").onclick=async e=>{const b=e.target.closest("[data-a]");if(!b)return;
  const card=b.closest(".card"),review=card.querySelector("textarea").value.trim();
  if(b.dataset.a==="rejected"&&!review){toast("Please explain what needs to change");return}
  try{await updateDoc(doc(db,"entries",card.dataset.id),{approval:b.dataset.a,review,reviewedAt:serverTimestamp(),reviewedBy:auth.currentUser.uid});toast("Saved")}
  catch{toast("Save failed — check admin permission in Firestore rules")}};
</script>
</body></html>
